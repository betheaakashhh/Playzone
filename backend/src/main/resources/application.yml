spring:
  application:
    name: playzone-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/playzone}
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
